name: Build JX-OS ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            librsvg2-bin \
            imagemagick

      - name: Copy assets into chroot includes
        run: |
          mkdir -p config/includes.chroot/usr/share/backgrounds/jxos
          mkdir -p config/includes.chroot/usr/share/jxos/logos
          mkdir -p config/includes.chroot/usr/share/grub/themes/jxos
          cp assets/wallpaper-*.svg config/includes.chroot/usr/share/backgrounds/jxos/
          cp assets/wallpaperdefault.svg config/includes.chroot/usr/share/backgrounds/jxos/
          cp assets/logo-Logo.svg config/includes.chroot/usr/share/jxos/logos/
          cp assets/logo-LogoBold.svg config/includes.chroot/usr/share/jxos/logos/
          cp assets/about.svg config/includes.chroot/usr/share/jxos/
          for svg in assets/wallpaper-*.svg assets/wallpaperdefault.svg; do
            base=$(basename "$svg" .svg)
            rsvg-convert -w 1920 -h 1080 "$svg" -o "config/includes.chroot/usr/share/backgrounds/jxos/${base}.png"
          done
          rsvg-convert -w 256 -h 256 assets/logo-LogoBold.svg -o config/includes.chroot/usr/share/jxos/logos/logo-256.png
          rsvg-convert -w 64 -h 64 assets/logo-LogoBold.svg -o config/includes.chroot/usr/share/grub/themes/jxos/logo.png

      - name: Configure live-build
        run: |
          cd config
          lb config \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer live \
            --bootappend-live "boot=live components quiet splash hostname=jxos username=jxos" \
            --iso-volume "JX-OS" \
            --iso-publisher "Voidagon Studios" \
            --iso-application "JX-OS" \
            --apt-options "--yes --no-install-recommends" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloaders "grub-efi,syslinux"

      - name: Build ISO
        run: |
          cd config
          sudo lb build 2>&1 | tee ../build.log

      - name: Rename ISO
        run: |
          ISO=$(find config -name "*.iso" | head -1)
          VERSION=${GITHUB_REF_NAME:-dev}
          mv "$ISO" "jxos-${VERSION}-amd64.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxos-iso
          path: "*.iso"
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.iso"
          body: |
            ## JX-OS ${{ github.ref_name }}

            Privacy-focused Linux OS built on Debian Bookworm with XFCE.

            ### Threat model coverage
            - Data minimisation and zero telemetry
            - ISP and network surveillance protection
            - Identity leak prevention
            - Physical access hardening

            ### Default credentials (live session)
            - Username: `jxos`
            - Password: `jxos`

            Flash to USB with `dd` or Balena Etcher.
